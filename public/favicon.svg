<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a0a"/>
  
  <!-- Golden accent circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
  
  <!-- House shape -->
  <g transform="translate(50, 50)">
    <!-- Roof -->
    <polygon points="0,-25 -20,-5 20,-5" fill="#d4af37"/>
    
    <!-- House body -->
    <rect x="-18" y="-5" width="36" height="28" fill="#f3ede2" stroke="#d4af37" stroke-width="1.5"/>
    
    <!-- Door -->
    <rect x="-8" y="8" width="8" height="15" fill="#0a0a0a" stroke="#d4af37" stroke-width="1"/>
    
    <!-- Door handle -->
    <circle cx="0" cy="15" r="1.5" fill="#d4af37"/>
    
    <!-- Left window -->
    <rect x="-16" y="0" width="7" height="7" fill="#c4a875" stroke="#d4af37" stroke-width="1"/>
    <line x1="-12.5" y1="0" x2="-12.5" y2="7" stroke="#d4af37" stroke-width="0.5"/>
    <line x1="-16" y1="3.5" x2="-9" y2="3.5" stroke="#d4af37" stroke-width="0.5"/>
    
    <!-- Right window -->
    <rect x="9" y="0" width="7" height="7" fill="#c4a875" stroke="#d4af37" stroke-width="1"/>
    <line x1="12.5" y1="0" x2="12.5" y2="7" stroke="#d4af37" stroke-width="0.5"/>
    <line x1="9" y1="3.5" x2="16" y2="3.5" stroke="#d4af37" stroke-width="0.5"/>
  </g>
</svg>
